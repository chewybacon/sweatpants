[package]
name = "flowmode-runtime-lua"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
piccolo = { path = "../../../.artifacts/flowmode-runtime-lua/piccolo" }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }
getrandom03 = { package = "getrandom", version = "0.3" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
